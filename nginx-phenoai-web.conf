# nginx site config — reverse proxy for PhenoAI web service
#
# Usage: symlink this file into /etc/nginx/sites-enabled/ and reload nginx.
#
#   ln -s /path/to/nginx-phenoai-web.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Adjust server_name and the /phenoai-web prefix as needed.

server {
    listen 80;
    server_name bivl2ab.uis.edu.co;

    # Existing phenoai collection server (keep as-is)
    # location /phenoai { ... }

    # ── PhenoAI web app ──────────────────────────────────────────
    location /phenoai-web/ {
        proxy_pass http://127.0.0.1:8008/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large file uploads (images)
        client_max_body_size 100M;

        # WebSocket support (if needed in the future)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts — inference can be slow on large batches
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
