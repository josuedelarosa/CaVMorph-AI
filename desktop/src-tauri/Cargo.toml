[package]
name = "cavfish-inference"
version = "0.1.0"
description = "Native desktop app for automated fish morphometrics"
authors = ["Aquaculture Research Team"]
edition = "2021"
rust-version = "1.60"
publish = false

[build-dependencies]
tauri-build = { version = "1.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.4", features = [ "protocol-asset", "http-all", "path-all", "fs-write-file", "fs-read-file", "fs-create-dir", "shell-sidecar", "fs-exists", "dialog-open", "dialog-save", "fs-read-dir" ] }
tokio = { version = "1.0", features = ["full"] }
dirs = "5.0"

[[bin]]
name = "cavfish-inference"
path = "src/main.rs"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true
codegen-units = 1
strip = true
panic = "abort"     # Smaller binary, no stack unwinding overhead

[features]
custom-protocol = ["tauri/custom-protocol"]
protocol-asset = ["tauri/protocol-asset"]
