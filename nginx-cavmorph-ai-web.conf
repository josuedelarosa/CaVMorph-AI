# nginx location block for CaVMorph-AI web service
#
# ADD this location block inside your existing server { listen 443 ssl; ... } block.
# Do NOT create a new server block — paste only the location {...} section below.
#
# The container binds to host port 8009 by default (CAVMORPH_AI_HOST_PORT in docker-compose).
# If you changed it, update the proxy_pass port here to match.
#
# Example of where to insert this in your existing nginx config:
#
#   server {
#       listen 443 ssl;
#       server_name bivl2ab.uis.edu.co;
#       ...
#       location /phenoai { ... }    # existing collection server
#
#       ### PASTE THE BLOCK BELOW HERE ###
#   }

location /cavmorph-ai-web/ {
    proxy_pass http://127.0.0.1:8009/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Per-file upload limit — files are uploaded one at a time.
    # 50M covers any single fish photo (RAW/JPEG from field cameras).
    client_max_body_size 50M;

    # WebSocket support (future-proofing)
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts — inference can be slow on large batches
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
