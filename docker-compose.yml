services:
  cavmorph-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cavmorph-ai-web
    restart: unless-stopped
    ports:
      - "${CAVMORPH_AI_HOST_PORT:-8009}:8008"
    environment:
      - FISH_MODEL_DIR=/app/models/cavfish_v1
      - CAVMORPH_AI_STATIC_DIR=/app/static
      - CAVMORPH_AI_HOST=0.0.0.0
      - CAVMORPH_AI_PORT=8008
      - CAVMORPH_AI_UPLOAD_DIR=/app/uploads
      # Set to "cpu" or "cuda" depending on the host
      - FISH_DEVICE=${FISH_DEVICE:-cpu}
    volumes:
      # Model files (bind-mount from host — not baked into image because *.onnx is gitignored).
      # Copy model.onnx and model_metadata.json into ./models/cavfish_v1/ on the server before
      # running `docker compose up`.
      - ./models/cavfish_v1:/app/models/cavfish_v1:ro
      # Uploads are ephemeral — deleted after each inference call; no volume needed.
