[project]
name = "cavfish-backend"
version = "0.1.0"
description = "Fish morphometrics backend inference server"
requires-python = ">=3.9,<3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "torch==2.1.0",
    "torchvision==0.16.0",
    "opencv-python==4.10.0.84",
    "pillow==11.0.0",
    "numpy==1.26.4",
    "scipy==1.14.1",
    "pandas==2.2.3",
    "pydantic==2.10.5",
    "mmengine==0.10.5",
    "mmcv==2.2.0",
    "yapf==0.43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cavfish", "api", "cavfish_backend", "phenolosses", "third_party"]
package-dir = {"" = "."}
